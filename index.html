<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b18">
<title>PS4 ALL HOST | GoldHEN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="host-wrap">
  <div class="brand">PLAYSTATION 4 • OFFLINE HOST</div>
  <h1><span class="accent">PS4 ALL HOST</span></h1>
  <p class="subtitle">GoldHEN • Exploit Environment • Firmware Detection</p>
  <section class="status-card">
    <div class="status-label">System status</div>
    <h1 id="msgs">Initializing host…</h1>
    <div class="fw-pill" id="fwInfo">Firmware: Detecting…</div>
  </section>
  <div class="features">
    <div class="feature"><b>Multi-FW</b>Firmware routing</div>
    <div class="feature"><b>OFFLINE</b>Cached host</div>
    <div class="feature"><b>GoldHEN</b>Payload support</div>
  </div>
  <div class="footer">PS4 HOST • KEEP THE CONSOLE IDLE WHILE THE EXPLOIT RUNS</div>
</div>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);
function setMessage(text, color) {
  var el = document.getElementById("msgs");
  if (el) { el.textContent = text; if (color) el.style.color = color; }
}
function onScriptError() { setMessage("Host file missing — clear browser data and reinstall cache", "#ff9aad"); }
window.addEventListener("DOMContentLoaded", function () {
  var fw = document.getElementById("fwInfo");
  if (fw) fw.textContent = "Firmware: " + fwVersion;
  if (!isPS4) setMessage("This host is intended for PlayStation 4", "#ffcf78");
});
if (!isPS4) {
  document.addEventListener("DOMContentLoaded", function () { setMessage("Only for PS4 consoles", "#ffcf78"); });
} else if (window.applicationCache.status == '0') {
  if (fwNum == 5.05 || fwNum == 5.07) window.location.replace("cache505.html");
  else if (fwNum >= 7.00 && fwNum <= 8.52) window.location.replace("cache700.html");
  else if (fwNum >= 9.00 && fwNum <= 9.60) window.location.replace("cache900.html");
  else if (fwNum >= 10.00 && fwNum <= 11.02) window.location.replace("cachecss.html");
  else if (fwNum >= 11.50 && fwNum <= 14.00) window.location.replace("cacheslopkit.html");
  else document.addEventListener("DOMContentLoaded", function () { setMessage("Unsupported Firmware: " + fwVersion, "#ff718e"); });
} else {
  var src = null, moduleType = false;
  if (fwNum == 5.05 || fwNum == 5.07) src = "505/exploit.js";
  else if (fwNum >= 7.00 && fwNum <= 8.52) { src = "700/alert.js"; moduleType = true; }
  else if (fwNum >= 9.00 && fwNum <= 9.60) { src = "900/alert.js"; moduleType = true; }
  else if (fwNum >= 10.00 && fwNum <= 11.02) src = "css/main.js";
  else if (fwNum >= 11.50 && fwNum <= 12.02) { src = "slopkit/chain_lapse.js"; moduleType = true; }
  else if (fwNum >= 12.50 && fwNum <= 13.00) { src = "slopkit/chain_poops.js"; moduleType = true; }
  else if (fwNum >= 13.02 && fwNum <= 13.52) { src = "slopkit/jb.js?v=19"; moduleType = true; }
  else if (fwNum == 14.00) { src = "slopkit/jb2.js"; moduleType = true; }
  if (src) {
    var script = document.createElement('script');
    if (moduleType) script.type = 'module';
    script.src = src;
    script.onerror = onScriptError;
    if (src === "css/main.js") script.onload = function () { setTimeout(function () { doJb(); }, 500); };
    document.head.appendChild(script);
  } else {
    document.addEventListener("DOMContentLoaded", function () { setMessage("Unsupported Firmware: " + fwVersion, "#ff718e"); });
  }
}
</script>
</body>
</html>
